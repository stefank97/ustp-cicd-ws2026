name: Publish

on:
  workflow_dispatch:

# Never run two deployments at the same time; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Reuses the existing build workflow (build + tests + artifact upload).
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      pull-requests: write

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: tetris-web-app
          path: dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
